<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0B1220" />
    <meta http-equiv="refresh" content="3;url=/portal" />
    <title>Connexion WiFi - Redirection</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0b1220;
        --panel: rgba(255, 255, 255, 0.08);
        --panel-border: rgba(255, 255, 255, 0.14);
        --text: #f5f7fb;
        --muted: rgba(245, 247, 251, 0.72);
        --accent: #27c08a;
        --accent-2: #7dd3fc;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(39, 192, 138, 0.22), transparent 32%),
          radial-gradient(circle at bottom right, rgba(125, 211, 252, 0.18), transparent 28%),
          linear-gradient(160deg, #09101d 0%, #111b31 100%);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(92vw, 520px);
        padding: 28px 24px;
        border-radius: 24px;
        border: 1px solid var(--panel-border);
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(39, 192, 138, 0.12);
        border: 1px solid rgba(39, 192, 138, 0.28);
        color: #d9fff0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(39, 192, 138, 0.55);
        animation: pulse 1.6s infinite;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(1.5rem, 4vw, 2.1rem);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .spinner {
        width: 54px;
        height: 54px;
        margin: 20px auto 18px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: var(--accent-2);
        animation: spin 1s linear infinite;
      }

      .countdown {
        margin-top: 14px;
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: 0.95rem;
        color: #dbeafe;
      }

      .link {
        display: inline-flex;
        margin-top: 18px;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #16a34a);
      }

      .small {
        margin-top: 14px;
        font-size: 12px;
        color: rgba(245, 247, 251, 0.58);
        word-break: break-all;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(39, 192, 138, 0.55); }
        70% { box-shadow: 0 0 0 14px rgba(39, 192, 138, 0); }
        100% { box-shadow: 0 0 0 0 rgba(39, 192, 138, 0); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge"><span class="dot"></span>Connexion WiFi etablie</div>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Redirection automatique en cours</h1>
      <p>Votre acces WiFi est active. Vous allez etre redirige automatiquement vers le portail.</p>
      <div class="countdown" id="countdown">Redirection dans 3 secondes...</div>
      <a class="link" id="manual-link" href="/portal">Continuer maintenant</a>
      <div class="small" id="target-label"></div>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search || '');
        const fallbackTarget = '/portal';
        const requestedTarget = params.get('next') || params.get('redirect') || params.get('url') || fallbackTarget;

        function resolveTarget(value) {
          try {
            const target = new URL(value, window.location.origin);
            if (target.origin === window.location.origin) {
              return target.href;
            }
          } catch (error) {
            return fallbackTarget;
          }
          return fallbackTarget;
        }

        const target = resolveTarget(requestedTarget);
        const targetLabel = document.getElementById('target-label');
        const manualLink = document.getElementById('manual-link');
        const countdown = document.getElementById('countdown');

        if (manualLink) manualLink.setAttribute('href', target);
        if (targetLabel) targetLabel.textContent = 'Destination : ' + target;

        let remaining = 3;
        const timer = setInterval(function () {
          remaining -= 1;
          if (countdown) countdown.textContent = 'Redirection dans ' + Math.max(0, remaining) + ' seconde' + (remaining > 1 ? 's' : '') + '...';
          if (remaining <= 0) {
            clearInterval(timer);
            window.location.replace(target);
          }
        }, 1000);

        window.setTimeout(function () {
          clearInterval(timer);
          window.location.replace(target);
        }, 3200);
      })();
    </script>
  </body>
</html>
