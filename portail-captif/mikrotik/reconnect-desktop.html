<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reconnexion PC - Village Connecte</title>
  <style>
    :root {
      --brand-primary: #55104d;
      --brand-dark: #3d0b38;
      --bg-base: #f4f6fa;
      --bg-card: #fffdfd;
      --text-primary: #2a1833;
      --text-muted: #707b8f;
      --border-subtle: rgba(85,16,77,0.08);
      --shadow-lg: 0 12px 40px rgba(85,16,77,0.14);
      --radius-xl: 22px;
      --radius-lg: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      min-height: 100vh;
      color: var(--text-primary);
      background: linear-gradient(180deg, #eef2f8, #f7f8fb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .panel {
      width: min(720px, 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .head {
      padding: 22px 26px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(135deg, #f5effa, #fff);
    }

    .head h1 {
      font-size: 1.45rem;
      color: var(--brand-primary);
      margin-bottom: 4px;
    }

    .head p {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .body {
      padding: 24px 26px 26px;
    }

    .saved {
      display: none;
      border: 1px solid rgba(22,163,74,0.28);
      background: rgba(22,163,74,0.08);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .saved .label {
      font-size: 0.76rem;
      text-transform: uppercase;
      color: #166534;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .saved .val {
      font-family: "Courier New", monospace;
      font-size: 1.3rem;
      letter-spacing: 0.14em;
      font-weight: 800;
      color: var(--brand-primary);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    .btn {
      min-height: 52px;
      border-radius: 12px;
      border: 0;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--brand-primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--brand-dark);
    }

    .btn-light {
      background: #fff;
      color: var(--brand-primary);
      border: 2px solid rgba(85,16,77,0.25);
    }

    .hint {
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 0.86rem;
    }

    @media (max-width: 760px) {
      body { padding: 12px; }
      .btn-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <h1>Reconnexion</h1>
      <p>Version grand ecran (PC / tablette)</p>
    </div>

    <div class="body">
      <div class="saved" id="saved-code-block">
        <div class="label">Code memorise</div>
        <div class="val" id="saved-code-val"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="btn-reconnect" disabled>Se reconnecter</button>
        <button class="btn btn-light" id="btn-new">Autre code ou acheter</button>
      </div>

      <div class="hint" id="hint-reconnect">Aucun code memorise.</div>
    </div>
  </div>

  <form id="sendin" method="post" style="display:none;">
    <input type="hidden" name="username">
    <input type="hidden" name="password">
    <input type="hidden" name="dst" value="">
    <input type="hidden" name="popup" value="false">
  </form>

  <input type="hidden" id="mt-mac" value="$(mac)">
  <input type="hidden" id="mt-ip" value="$(ip)">
  <input type="hidden" id="mt-server-name" value="$(server-name)">
  <input type="hidden" id="mt-link-login" value="$(link-login)">

  <script>
    function cleanValue(v) {
      var t = String(v || '').trim();
      return (!t || t.indexOf('$(') === 0) ? '' : t;
    }
    function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
    function lsRemove(k) { try { localStorage.removeItem(k); } catch(e) {} }
    function getQuery(n) { try { return new URLSearchParams(window.location.search).get(n) || ''; } catch(e) { return ''; } }

    var clientMac = cleanValue(document.getElementById('mt-mac').value);
    var clientIp = cleanValue(document.getElementById('mt-ip').value);
    var borneId = cleanValue(document.getElementById('mt-server-name').value) || 'B08';
    var host = window.location.hostname;

    var VC_API_BASE = 'http://192.168.1.128:3001';

    function apiFetch(url, opts) {
      return fetch(url, opts).catch(function () {
        var alt = url.startsWith('https:') ? url.replace('https:', 'http:') : url.replace('http:', 'https:');
        return fetch(alt, opts);
      });
    }

    function getStatusUrl(code) {
      return 'http://' + host + '/status.html?code=' + encodeURIComponent(code);
    }

    function submitToMikrotik(code) {
      var form = document.getElementById('sendin');
      form.action = 'http://' + host + '/login';
      form.username.value = code;
      form.password.value = code;
      var dstInput = form.querySelector('[name="dst"]');
      if (dstInput) dstInput.value = getStatusUrl(code);
      form.submit();
    }

    var btnReconnect = document.getElementById('btn-reconnect');
    var btnNew = document.getElementById('btn-new');
    var savedBlock = document.getElementById('saved-code-block');
    var savedVal = document.getElementById('saved-code-val');
    var hintReconnect = document.getElementById('hint-reconnect');

    async function activateAndConnect(code) {
      btnReconnect.disabled = true;
      btnReconnect.textContent = 'Connexion en cours...';
      lsSet('vc_last_code', code);
      lsRemove('vc_disconnecting');

      try {
        var resp = await apiFetch(VC_API_BASE + '/api/captive/sessions/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: code,
            mac: clientMac || undefined,
            ip_address: clientIp || undefined,
            borneId: borneId || undefined
          }),
          credentials: 'omit'
        });
        var result = await resp.json();

        if (!resp.ok || result.ok === false) {
          btnReconnect.disabled = false;
          btnReconnect.textContent = 'Se reconnecter';
          hintReconnect.textContent = result.error || 'Code invalide ou expire.';
          return;
        }

        var sid = result.session && result.session.id;
        if (sid) lsSet('vc_last_session_id', sid);
      } catch (e) {
        console.warn('activate error (non bloquant):', e.message);
      }

      submitToMikrotik(code);
    }

    lsRemove('vc_disconnecting');
    lsRemove('vc_last_session_id');

    var savedCode = (getQuery('code') || lsGet('vc_last_code')).replace(/\s/g, '').toUpperCase();
    if (savedCode) lsSet('vc_last_code', savedCode);

    if (savedCode) {
      savedBlock.style.display = 'block';
      savedVal.textContent = savedCode.length > 4 ? savedCode.substr(0,4) + ' ' + savedCode.substr(4) : savedCode;
      hintReconnect.textContent = 'Reconnexion avec le code memorise.';
      btnReconnect.disabled = false;
    }

    btnReconnect.addEventListener('click', function () {
      if (!savedCode) return;
      activateAndConnect(savedCode);
    });

    var injectedLogin = cleanValue(document.getElementById('mt-link-login').value);
    var loginUrl = injectedLogin || ('http://' + host + '/login');

    btnNew.addEventListener('click', function () {
      lsRemove('vc_last_code');
      window.location.replace(loginUrl);
    });
  </script>
</body>
</html>
